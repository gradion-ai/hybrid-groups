name: Claude Auto Review

on:
  pull_request:
    types: [opened]

jobs:
  auto-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ vars.CI_UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev
          uv pip list

      - name: Automatic PR Review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          timeout_minutes: "60"

          # Allow Claude to run specific commands
          allowed_tools: "*"

          # Direct prompt for automatic review
          direct_prompt: |
            Please review this pull request and provide comprehensive feedback.

            IMPORTANT: This is a research prototype. While code quality is important, production-readiness is not the current focus.

            Focus on:
            - Code maintainability and readability
            - Separation of concerns and architectural clarity
            - Logical correctness and potential bugs
            - Clear abstractions and interfaces

            De-emphasize:
            - Production deployment concerns (scaling, monitoring, etc.)
            - Performance optimizations unless critical
            - Security hardening beyond basic practices
            - Comprehensive error handling for edge cases

            Provide constructive feedback focused on making the code clear, maintainable, and architecturally sound for a research prototype.
            Use inline comments to highlight specific areas that could improve code clarity or structure.
